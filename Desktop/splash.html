<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(160deg, #0B1F3A 0%, #1D3A5F 100%);
    color: #fff;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box { text-align: center; }
  h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: 0.5px; }
  p { font-size: 12px; color: #C9A227; margin: 0 0 24px; }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #C9A227;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { margin-top: 16px; font-size: 11px; color: #A9B7C6; }
</style>
</head>
<body>
  <div class="box">
    <h1>Imran Pro Services</h1>
    <p>CRM &amp; Business Automation Platform</p>
    <div class="spinner"></div>
    <div class="status" id="status">Starting local services&hellip;</div>
  </div>
  <script>
    if (window.splashAPI) {
      window.splashAPI.onStatus((text) => {
        document.getElementById('status').textContent = text;
      });
    }
  </script>
</body>
</html>
